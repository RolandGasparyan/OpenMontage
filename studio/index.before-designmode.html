<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Montage Studio</title>
<style>
  /* ── tokens ─────────────────────────────────────────────────────────── */
  :root{
    --bg:#0e0f11; --panel:#17181b; --panel-2:#1e2024; --line:#282a2f;
    --t1:#f0f1f4; --t2:#a7abb4; --t3:#7b7f88;
    --lime:#d8f95a; --lime-d:#b6d92f; --green:#41d98a; --amber:#ffc24d; --red:#ff6b63;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
    --r1:10px; --r2:14px; --r3:20px;
    --maxw:980px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{font-size:clamp(16px,.3vw + 13.2px,17px);-webkit-text-size-adjust:100%}
  body{
    background:var(--bg); color:var(--t1); min-height:100dvh;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,Roboto,sans-serif;
    font-size:1rem; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(216,249,90,.28)}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  :focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:6px}

  /* ── top bar ────────────────────────────────────────────────────────── */
  .bar{
    position:sticky; top:0; z-index:30; height:3.5rem; display:flex; align-items:center; gap:var(--s3);
    padding:0 clamp(16px,4vw,32px); border-bottom:1px solid var(--line);
    background:rgba(14,15,17,.88); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  }
  .brand{display:flex;align-items:center;gap:.5rem;font-size:.95rem;font-weight:800;letter-spacing:.06em;white-space:nowrap}
  .brand .spark{color:var(--lime);font-size:1.05rem}
  .bar .spacer{flex:1}
  .langs{display:inline-flex;background:var(--panel-2);border-radius:var(--r1);padding:3px;gap:3px}
  .langs button{font-size:.8rem;font-weight:700;letter-spacing:.03em;color:var(--t2);padding:.3rem .7rem;border-radius:8px}
  .langs button.on{background:#3a3d44;color:#fff}
  .status{display:inline-flex;align-items:center;gap:.45rem;font-size:.85rem;color:var(--t2)}
  .status::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
  .status.off::before{background:var(--t3);box-shadow:none}

  /* ── layout ─────────────────────────────────────────────────────────── */
  .wrap{max-width:var(--maxw);margin:0 auto;padding:clamp(24px,4vh,56px) clamp(16px,4vw,32px) var(--s8)}
  .hero{text-align:center;margin-bottom:clamp(20px,3vh,32px)}
  .hero h1{
    font-size:clamp(2.1rem,4.4vw,3.5rem); line-height:1.08; font-weight:800; letter-spacing:-.01em;
    text-transform:uppercase; text-wrap:balance;
    background:linear-gradient(180deg,#fff 25%,#a8abb2 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero p{margin-top:.6rem;font-size:.9rem;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);text-wrap:balance}

  /* ── composer ───────────────────────────────────────────────────────── */
  .composer{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--r3);
    padding:var(--s4); box-shadow:0 24px 60px rgba(0,0,0,.45);
  }
  .modes{display:flex;gap:var(--s1);margin-bottom:var(--s3)}
  .mode{
    flex:1; min-height:2.75rem; border-radius:var(--r1); background:var(--panel-2);
    color:var(--t2); font-size:.9rem; font-weight:600; display:flex;align-items:center;justify-content:center;gap:.45rem;
    transition:background .15s,color .15s;
  }
  .mode:hover{background:#262932}
  .mode.on{background:#2d3038;color:#fff}

  textarea{
    width:100%; min-height:7rem; resize:vertical; display:block;
    background:var(--panel-2); border:1px solid transparent; border-radius:var(--r2);
    padding:var(--s4); color:var(--t1); font:inherit; font-size:1.05rem; line-height:1.55;
  }
  textarea::placeholder{color:var(--t3)}
  textarea:focus{border-color:#3d4149;outline:none}

  .row4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2);margin-top:var(--s3)}
  .opt{
    min-height:3.25rem; background:var(--panel-2); border:1px solid transparent; border-radius:var(--r1);
    padding:.5rem .8rem; text-align:left; display:flex; flex-direction:column; justify-content:center; gap:.15rem;
    transition:border-color .15s,background .15s;
  }
  .opt:hover{border-color:#3d4149;background:#24272d}
  .opt .k{font-size:.84rem;color:#b3b7bf;letter-spacing:.01em}
  .opt .v{font-size:.95rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .go{
    width:100%; min-height:3.5rem; margin-top:var(--s3); border-radius:var(--r2);
    background:linear-gradient(180deg,var(--lime),var(--lime-d)); color:#15170a;
    font-size:1.05rem; font-weight:800; letter-spacing:.08em;
    box-shadow:0 3px 0 #93b21f, 0 12px 28px rgba(216,249,90,.18);
    transition:transform .1s,box-shadow .1s,filter .15s;
  }
  .go:hover{transform:translateY(-1px);box-shadow:0 4px 0 #93b21f,0 16px 34px rgba(216,249,90,.26)}
  .go:active{transform:translateY(2px);box-shadow:0 1px 0 #93b21f}
  .go:disabled{filter:grayscale(.5) brightness(.75);cursor:default;transform:none}

  .more{
    width:100%; margin-top:var(--s2); min-height:2.6rem; border-radius:var(--r1);
    color:var(--t2); font-size:.85rem; font-weight:600;
  }
  .more:hover{color:var(--t1);background:var(--panel-2)}

  .adv{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2);margin-top:var(--s2)}
  .adv[hidden]{display:none}
  .adv .opt{min-height:3rem}
  .adv .wide{grid-column:1/-1}
  .stepper{display:flex;flex-direction:column;justify-content:center;gap:.2rem;
    background:var(--panel-2);border-radius:var(--r1);min-height:3rem;padding:.5rem .8rem}
  .stepper .k{font-size:.84rem;color:#b3b7bf}
  .stp-ctl{display:flex;align-items:center;gap:.2rem}
  .stp-ctl button{width:1.9rem;height:1.9rem;border-radius:7px;color:var(--t2);font-size:1.05rem;line-height:1}
  .stp-ctl button:hover{background:#34373e;color:#fff}
  .stp-ctl b{flex:1;text-align:center;font-size:.95rem;font-weight:600}

  .toast{display:none;margin-top:var(--s3);padding:.75rem 1rem;border-radius:var(--r1);
    background:var(--panel-2);border:1px solid var(--line);font-size:.9rem;color:var(--t2);text-align:center}
  .toast b{color:var(--lime)}

  /* ── sections ───────────────────────────────────────────────────────── */
  .sec{margin-top:var(--s8)}
  .sec > h2{
    font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t2);
    margin-bottom:var(--s3);
  }
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--s3)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;
    cursor:pointer;transition:transform .16s,border-color .16s}
  .card:hover{transform:translateY(-2px);border-color:#3a3d44}
  .poster{position:relative;aspect-ratio:16/9;background:#131417}
  .poster img,.poster video{width:100%;height:100%;object-fit:cover;display:block}
  .flag{position:absolute;top:.6rem;left:.6rem;font-size:.72rem;font-weight:700;letter-spacing:.04em;
    padding:.25rem .6rem;border-radius:999px;background:rgba(14,15,17,.82);color:var(--t2);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .flag.live{color:var(--lime)} .flag.gate{color:var(--amber)}
  .card .body{padding:var(--s3) var(--s4) var(--s4)}
  .card .title{font-size:1rem;font-weight:600;line-height:1.35;margin-bottom:.6rem;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .prog{height:3px;border-radius:2px;background:#2a2d33;overflow:hidden;margin-bottom:.55rem}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--lime-d));transition:width .4s}
  .meta{font-size:.82rem;color:var(--t3);display:flex;gap:.7rem;flex-wrap:wrap}

  .req{display:flex;gap:var(--s3);align-items:flex-start;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--r2);padding:var(--s3) var(--s4);margin-bottom:var(--s2)}
  .req .st{flex:none;font-size:.72rem;font-weight:700;letter-spacing:.05em;padding:.3rem .6rem;border-radius:999px;white-space:nowrap}
  .st.queued{background:rgba(216,249,90,.12);color:var(--lime)}
  .st.started,.st.done{background:rgba(65,217,138,.12);color:var(--green)}
  .req .p{flex:1;min-width:0;font-size:.95rem;line-height:1.5;overflow-wrap:anywhere}
  .req .t{flex:none;max-width:13rem;text-align:right;font-size:.8rem;color:var(--t3);line-height:1.5;overflow-wrap:anywhere}

  .empty{padding:var(--s5) var(--s4);border:1px dashed #303339;border-radius:var(--r2);
    color:var(--t3);font-size:.95rem;text-align:center;line-height:1.6}
  .empty b{color:var(--lime)}

  /* ── menu ───────────────────────────────────────────────────────────── */
  .menu{position:fixed;z-index:100;display:none;min-width:15rem;max-width:min(21rem,calc(100vw - 24px));
    background:#1c1e23;border:1px solid #33363d;border-radius:var(--r2);padding:var(--s1);
    box-shadow:0 20px 50px rgba(0,0,0,.6)}
  .menu.open{display:block}
  .menu .mi{display:flex;align-items:center;gap:.6rem;padding:.6rem .75rem;border-radius:9px;
    font-size:.9rem;cursor:pointer}
  .menu .mi:hover{background:#262932}
  .menu .mi.sel{color:var(--lime);font-weight:600}
  .menu .mi.sel::after{content:"✓";margin-left:auto;font-size:.8rem}
  .menu .mi .sub{color:var(--t3);font-size:.78rem;margin-left:auto}
  .menu .mi.danger{color:var(--red)}
  .menu .sep{height:1px;background:#33363d;margin:var(--s1) var(--s2)}

  /* ── detail sheet ───────────────────────────────────────────────────── */
  .overlay{position:fixed;inset:0;z-index:50;display:none;overflow-y:auto;
    background:rgba(8,9,11,.74);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    padding:6vh clamp(12px,5vw,64px)}
  .overlay.open{display:block}
  .sheet{position:relative;max-width:860px;margin:0 auto;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--r3);padding:var(--s5);
    box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .close{position:absolute;top:var(--s3);right:var(--s3);width:2rem;height:2rem;border-radius:50%;
    background:var(--panel-2);color:var(--t2);font-size:.95rem}
  .close:hover{color:#fff;background:#34373e}
  .sheet h3{font-size:1.35rem;font-weight:700;line-height:1.25;padding-right:2.5rem;
    overflow-wrap:anywhere;margin-bottom:.3rem}
  .sheet .sub{color:var(--t3);font-size:.85rem;margin-bottom:var(--s5)}
  .stages{display:flex;flex-direction:column;gap:1px}
  .stage{display:flex;align-items:center;gap:.75rem;font-size:.95rem;padding:.45rem 0}
  .sdot{width:.55rem;height:.55rem;border-radius:50%;flex:none;background:#2f3238}
  .sdot.completed{background:var(--green);box-shadow:0 0 8px rgba(65,217,138,.5)}
  .sdot.in_progress{background:var(--lime);box-shadow:0 0 8px rgba(216,249,90,.5);animation:pulse 1.6s infinite}
  .sdot.awaiting_human{background:var(--amber);box-shadow:0 0 8px rgba(255,194,77,.5)}
  .sdot.failed{background:var(--red)}
  @keyframes pulse{50%{opacity:.45}}
  .stage .nm{color:var(--t3)}
  .stage.completed .nm,.stage.in_progress .nm{color:var(--t1)}
  .gate-tag{margin-left:auto;font-size:.72rem;color:var(--amber);background:rgba(255,194,77,.12);
    padding:.15rem .55rem;border-radius:999px}
  .h4{font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t2);
    margin:var(--s5) 0 var(--s3)}
  .renders video{width:100%;border-radius:var(--r2);background:#000;margin-bottom:var(--s3)}
  .snaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s2)}
  .snaps img,.snaps video{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:var(--r1);background:#000}

  /* ── responsive ─────────────────────────────────────────────────────── */
  @media (max-width:720px){
    .row4{grid-template-columns:repeat(2,1fr)}
    .adv{grid-template-columns:1fr}
    .req{flex-wrap:wrap}
    .req .t{max-width:none;text-align:left;width:100%}
    .hero h1{font-size:clamp(1.8rem,7vw,2.6rem)}
    textarea{resize:none}
  }
  @media (max-width:480px){
    .bar{gap:.5rem;padding:0 14px}
    .brand{font-size:.85rem;letter-spacing:.04em}
    .langs button{padding:.25rem .5rem;font-size:.78rem}
    .status{font-size:0;gap:0}          /* keep the dot, drop the wrapped label */
    .status::before{width:.55rem;height:.55rem}
    .hero p{font-size:.8rem;letter-spacing:.06em}
  }
  @media (min-width:1600px){
    :root{--maxw:1060px}
  }
</style>
</head>
<body>

<header class="bar">
  <span class="brand"><span class="spark">✦</span> MONTAGE STUDIO</span>
  <span class="spacer"></span>
  <div class="langs" id="langs">
    <button data-lang="hy" class="on">ՀՅ</button>
    <button data-lang="en">EN</button>
    <button data-lang="ru">RU</button>
  </div>
  <span class="status" id="health">live</span>
</header>

<main class="wrap">
  <section class="hero">
    <h1 id="headline"></h1>
    <p id="tagline"></p>
  </section>

  <section class="composer">
    <div class="modes">
      <button class="mode on" data-mode="video"><span>🎬</span><span id="mode-video"></span></button>
      <button class="mode" data-mode="image"><span>🖼️</span><span id="mode-image"></span></button>
    </div>

    <textarea id="prompt" rows="4"></textarea>

    <div class="row4">
      <button class="opt" data-ctl="duration"><span class="k" id="k-duration"></span><span class="v" id="val-duration"></span></button>
      <button class="opt" data-ctl="aspect"><span class="k" id="k-aspect"></span><span class="v" id="val-aspect"></span></button>
      <button class="opt" data-ctl="style"><span class="k" id="k-style"></span><span class="v" id="val-style"></span></button>
      <button class="opt" data-ctl="resolution"><span class="k" id="k-quality"></span><span class="v" id="val-resolution"></span></button>
    </div>

    <button class="go" id="go"></button>
    <button class="more" id="more"></button>

    <div class="adv" id="adv" hidden>
      <button class="opt" data-ctl="camera"><span class="k" id="k-camera"></span><span class="v" id="val-camera"></span></button>
      <button class="opt" data-ctl="lighting"><span class="k" id="k-lighting"></span><span class="v" id="val-lighting"></span></button>
      <button class="opt" data-ctl="color"><span class="k" id="k-color"></span><span class="v" id="val-color"></span></button>
      <button class="opt" data-ctl="pipeline"><span class="k" id="k-pipeline"></span><span class="v" id="val-pipeline"></span></button>
      <button class="opt" id="audio-pill"><span class="k" id="k-audio"></span><span class="v" id="val-audio"></span></button>
      <div class="stepper">
        <span class="k" id="k-variants"></span>
        <div class="stp-ctl">
          <button id="var-minus" aria-label="−">−</button>
          <b id="val-variants">1</b>
          <button id="var-plus" aria-label="＋">＋</button>
        </div>
      </div>
      <button class="opt wide" id="refs-pill"><span class="k" id="k-refs"></span><span class="v" id="val-refs">0 / 50</span></button>
    </div>

    <div class="toast" id="toast"></div>
  </section>

  <section class="sec">
    <h2 id="sec-requests"></h2>
    <div id="requests"></div>
  </section>

  <section class="sec">
    <h2 id="sec-productions"></h2>
    <div id="projects"></div>
  </section>
</main>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="menu" id="menu"></div>

<script>
const $ = s => document.querySelector(s);
const MEDIA_EXT = ["mp4","webm","mov"];

/* ── i18n ──────────────────────────────────────────────────────────────── */
const I18N = {
  hy: {
    headline:"ԿԵՆԴԱՆԱՑՐՈՒ ՔՈ ՊԱՏՄՈՒԹՅՈՒՆՆԵՐԸ",

    audioOn:"Միացված", audioOff:"Անջատված", auto:"Ավտո", autoPipeline:"Ավտո փայփլայն", autoSub:"ագենտը կընտրի լավագույնը",

    err:"Սխալ՝ ", ago:["հիմա","րոպե առաջ","ժամ առաջ","օր առաջ"], pct:"% պատրաստ",
    flagGate:"⏸ հաստատում", flagLive:"● LIVE", noAudio:"առանց ձայնի",
    finalVideos:"Պատրաստի տեսանյութեր", frames:"Կադրեր", liveNow:"ուղիղ եթերում", approval:"հաստատում",
    refsAdd:"＋ Ավելացնել հղում", refsRemove:"հեռացնել",
    refsConfirm:"Հեռացնե՞լ այս ռեֆերենսը։", refsPrompt:"Հղում (YouTube, նկար կամ տեսանյութ)՝",
    subs:{
      style:{cinematic:"կինեմատիկ",animation:"անիմացիա / Pixar",documentary:"վավերագրական","music video":"երաժշտական տեսահոլովակ","3d showcase":"3D շոու"},
      camera:{handheld:"ձեռքի տեսախցիկ",drone:"դրոն / օդային",static:"ստատիկ",dolly:"դոլի սահում","crash zoom":"կտրուկ զում",orbit:"պտույտ օբյեկտի շուրջ"},

let LANG = localStorage.getItem("studio-lang") || "hy";
const t = () => I18N[LANG] || I18N.hy;

/* ── state ─────────────────────────────────────────────────────────────── */
const state = {
  mode:"video", style:"Auto", camera:"Auto", color:"Auto", lighting:"Auto",
  pipeline:"Auto Pipeline", resolution:"1080p", aspect:"16:9",
  duration:"60s", audio:true, variants:1, references:[]
};
const OPTIONS = {
  style:["Auto","cinematic","animation","documentary","music video","3d showcase"],
  camera:["Auto","handheld","drone","static","dolly","crash zoom","orbit"],
  color:["Auto","moody dark","warm golden","neon","pastel","monochrome","teal & orange"],
  lighting:["Auto","natural","golden hour","studio","neon night","dramatic","soft diffuse"],
  pipeline:["Auto Pipeline","bgm-montage-lite","hyperframes","remotion","blender-3d","ink-theater"],
  resolution:["720p","1080p","4K"],
  aspect:[["16:9",{hy:"հորիզոնական",en:"horizontal",ru:"горизонтально"}],
          ["9:16",{hy:"ուղղահայաց / Reels",en:"vertical / Reels",ru:"вертикально / Reels"}],
          ["1:1",{hy:"քառակուսի",en:"square",ru:"квадрат"}]],
  duration:["30s","60s","90s","120s"]
};
const aspectValues = () => OPTIONS.aspect.map(a => a[0]);
const optionsFor = k => k === "aspect" ? aspectValues() : OPTIONS[k];

function display(k, v){
  const L = t();
  if (v === "Auto") return L.auto;
  if (v === "Auto Pipeline") return L.autoPipeline;
  if (k === "aspect"){
    const hit = OPTIONS.aspect.find(a => a[0] === v);
    return hit ? (hit[1][LANG] || hit[1].en) : v;
  }
  if (k === "audio") return v ? L.audioOn : L.audioOff;
  return v;
}
function subFor(k, v){
  const L = t();
  if (v === "Auto") return L.autoSub;
  if (v === "Auto Pipeline") return L.subs.pipeline["Auto Pipeline"];
  if (k === "aspect"){ const hit = OPTIONS.aspect.find(a => a[0] === v); return hit ? (hit[1][LANG] || hit[1].en) : ""; }
  return (L.subs[k] && L.subs[k][v]) || "";
}

/* ── language ──────────────────────────────────────────────────────────── */
function applyLang(){
  const L = t();
  document.documentElement.lang = LANG;
  $("#headline").textContent = L.headline;
  $("#health").title = L.live;
  $("#tagline").textContent = L.tagline;
  $("#mode-video").textContent = L.modeVideo;
  $("#mode-image").textContent = L.modeImage;
  $("#k-duration").textContent = L.kDuration;
  $("#k-aspect").textContent = L.kAspect;
  $("#k-style").textContent = L.kStyle;
  $("#k-quality").textContent = L.kQuality;
  $("#k-camera").textContent = L.kCamera;
  $("#k-lighting").textContent = L.kLighting;
  $("#k-color").textContent = L.kColor;
  $("#k-pipeline").textContent = L.kPipeline;
  $("#k-audio").textContent = L.kAudio;
  $("#k-variants").textContent = L.kVariants;
  $("#k-refs").textContent = L.kRefs;
  $("#go").textContent = L.go;
  $("#more").textContent = $("#adv").hidden ? L.more : L.less;
  $("#sec-requests").textContent = L.secRequests;
  $("#sec-productions").textContent = L.secProductions;
  $("#prompt").placeholder = state.mode === "image" ? L.phImage : L.phVideo;
  document.querySelectorAll("#langs button").forEach(b => b.classList.toggle("on", b.dataset.lang === LANG));
  syncAll();
}

/* ── menu ──────────────────────────────────────────────────────────────── */
const menu = $("#menu");
function openMenu(anchor, items, onPick){
  menu.innerHTML = "";
  items.forEach(it => {
    if (it === "-"){ const s = document.createElement("div"); s.className = "sep"; menu.appendChild(s); return; }
    const d = document.createElement("div");
    d.className = "mi" + (it.sel ? " sel" : "") + (it.danger ? " danger" : "");
    d.innerHTML = `<span>${it.label}</span>` + (it.sub ? `<span class="sub">${it.sub}</span>` : "");
    d.addEventListener("click", ev => {
      ev.stopPropagation(); closeMenu();
      if (it.danger && !confirm(it.confirm || "")) return;
      onPick && onPick(it);
    });
    menu.appendChild(d);
  });
  const r = anchor.getBoundingClientRect();
  menu.classList.add("open");
  const w = menu.offsetWidth, h = menu.offsetHeight;
  menu.style.left = Math.max(12, Math.min(r.left, window.innerWidth - w - 12)) + "px";
  let top = r.bottom + 6;
  if (top + h > window.innerHeight - 12) top = Math.max(12, r.top - h - 6);
  menu.style.top = top + "px";
}
function closeMenu(){ menu.classList.remove("open"); }
document.addEventListener("click", () => closeMenu());
document.addEventListener("keydown", e => { if (e.key === "Escape"){ closeMenu(); closeDetail(); } });

/* ── controls ──────────────────────────────────────────────────────────── */
function syncVal(k){
  const el = $("#val-" + k);
  if (!el) return;
  el.textContent = display(k, state[k]);
  if (k === "references") el.textContent = `${state.references.length} / 50`;
  if (k === "audio") el.textContent = display("audio", state.audio);
}
function syncAll(){
  ["style","camera","color","lighting","pipeline","resolution","aspect","duration","audio"].forEach(syncVal);
  $("#val-variants").textContent = state.variants;
  $("#val-refs").textContent = `${state.references.length} / 50`;
}
document.querySelectorAll("[data-ctl]").forEach(el => {
  el.addEventListener("click", ev => {
    ev.stopPropagation();
    const k = el.dataset.ctl;
    const items = optionsFor(k).map(v => ({ label: display(k, v), sub: subFor(k, v), sel: state[k] === v, value: v }));
    openMenu(el, items, it => { state[k] = it.value; syncVal(k); });
  });
});
$("#audio-pill").addEventListener("click", ev => { ev.stopPropagation(); state.audio = !state.audio; syncVal("audio"); });
$("#var-minus").addEventListener("click", () => { state.variants = Math.max(1, state.variants - 1); syncVal("variants"); });
$("#var-plus").addEventListener("click", () => { state.variants = Math.min(4, state.variants + 1); syncVal("variants"); });

$("#refs-pill").addEventListener("click", ev => {
  ev.stopPropagation();
  const L = t();
  const items = state.references.map((r, i) => ({
    label: r.length > 32 ? r.slice(0, 32) + "…" : r, sub: L.refsRemove, danger: true, confirm: L.refsConfirm, idx: i
  }));
  items.push("-", { label: L.refsAdd, idx: -1 });
  openMenu($("#refs-pill"), items, it => {
    if (it.idx >= 0) state.references.splice(it.idx, 1);
    else {
      const url = prompt(L.refsPrompt);
      if (url && url.trim() && state.references.length < 50) state.references.push(url.trim());
    }
    syncVal("references");
  });
});

document.querySelectorAll(".mode").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".mode").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  state.mode = b.dataset.mode;
  $("#prompt").placeholder = state.mode === "image" ? t().phImage : t().phVideo;
}));

$("#more").addEventListener("click", () => {
  const adv = $("#adv");
  adv.hidden = !adv.hidden;
  $("#more").textContent = adv.hidden ? t().more : t().less;
});

/* ── generate ──────────────────────────────────────────────────────────── */
$("#go").addEventListener("click", async () => {
  const prompt = $("#prompt").value.trim();
  if (!prompt){ $("#prompt").focus(); return; }
  $("#go").disabled = true;
  try {
    const r = await fetch("/api/request", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ ...state, prompt })
    });
    if (!r.ok) throw new Error(await r.text());
    $("#prompt").value = "";
    const tt = $("#toast");
    tt.innerHTML = t().toast;
    tt.style.display = "block";
    setTimeout(() => tt.style.display = "none", 7000);
    renderRequests();
  } catch (e){ alert(t().err + e.message); }
  $("#go").disabled = false;
});

/* ── data ──────────────────────────────────────────────────────────────── */
const mediaUrl = (pid, p) => `/media/${pid}/${encodeURI(p).replace(/%2F/g, "/")}`;
const mediaTag = (pid, p) => MEDIA_EXT.includes(p.split(".").pop().toLowerCase())
  ? `<video src="${mediaUrl(pid, p)}" muted preload="metadata"></video>`
  : `<img src="${mediaUrl(pid, p)}" loading="lazy" alt="">`;
function timeAgo(ts){
  if (!ts) return "";
  const [now, m, h, d] = t().ago;
  const s = Math.max(0, Date.now() / 1000 - ts);
  if (s < 60) return now;
  if (s < 3600) return Math.floor(s / 60) + " " + m;
  if (s < 86400) return Math.floor(s / 3600) + " " + h;
  return Math.floor(s / 86400) + " " + d;
}

let openProject = null;

async function renderProjects(){
  let list = [];
  try { list = await (await fetch("/api/projects")).json(); } catch {}
  const el = $("#projects"), L = t();
  if (!list.length){ el.innerHTML = `<div class="empty">${L.emptyProjects}</div>`; return; }
  el.innerHTML = `<div class="grid">` + list.map(p => {
    const stages = p.stage_states || [];
    const done = stages.filter(s => s.status === "completed").length;
    const pct = stages.length ? Math.round(100 * done / stages.length) : 0;
    const flag = p.awaiting_human ? `<span class="flag gate">${L.flagGate}</span>`
      : p.live ? `<span class="flag live">${L.flagLive}</span>` : "";
    const poster = p.poster ? mediaTag(p.project_id, p.poster)
      : `<div style="display:grid;place-items:center;height:100%;font-size:2rem">🎞️</div>`;
    return `<div class="card" onclick="openDetail('${p.project_id}')">
      <div class="poster">${poster}${flag}</div>
      <div class="body">
        <div class="title">${p.title || p.project_id}</div>
        <div class="prog"><i style="width:${pct}%"></i></div>
        <div class="meta">
          <span>${pct}${L.pct || "%"}</span>
          ${p.active_stage ? `<span>▶ ${p.active_stage}</span>` : ""}
          ${p.render_count ? `<span>🎬 ${p.render_count}</span>` : ""}
          <span>${timeAgo(p.last_activity)}</span>
        </div>
      </div>
    </div>`;
  }).join("") + `</div>`;
}

async function renderRequests(){
  let list = [];
  try { list = await (await fetch("/api/requests")).json(); } catch {}
  const el = $("#requests"), L = t();
  if (!list.length){ el.innerHTML = `<div class="empty">${L.emptyRequests}</div>`; return; }
  const label = { queued:L.stQueued, started:L.stStarted, done:L.stDone };
  el.innerHTML = list.slice(0, 10).map(r => {
    const bits = [r.duration, r.aspect, r.resolution,
      (r.style && r.style !== "Auto") ? r.style : null,
      r.audio === false ? L.noAudio : null,
      (r.references || []).length ? "📎 " + r.references.length : null
    ].filter(Boolean).join(" · ");
    return `<div class="req">
      <span class="st ${r.status}">${label[r.status] || r.status}</span>
      <span class="p">${r.mode === "image" ? "🖼️ " : ""}${r.prompt}</span>
      <span class="t">${bits}${r.variants > 1 ? `<br>${r.variants} ${L.kVariants.toLowerCase()}` : ""}</span>
    </div>`;
  }).join("");
}

async function openDetail(pid){ openProject = pid; $("#overlay").classList.add("open"); await renderDetail(); }
function closeDetail(){ openProject = null; $("#overlay").classList.remove("open"); }

async function renderDetail(){
  if (!openProject) return;
  let st;
  try { st = await (await fetch(`/api/project/${openProject}`)).json(); } catch { return; }
  const L = t();
  const stages = (st.stages || []).map(s => `<div class="stage ${s.status}">
      <span class="sdot ${s.status}"></span><span class="nm">${s.name}</span>
      ${s.gated ? `<span class="gate-tag">${L.approval}</span>` : ""}
    </div>`).join("");
  const renders = (st.media?.renders || []).map(r =>
    `<video src="${mediaUrl(st.project_id, r.path)}" controls preload="metadata"></video>`).join("");
  const snaps = (st.media?.snapshots || []).slice(0, 12).map(s => mediaTag(st.project_id, s.path)).join("");
  $("#sheet").innerHTML = `
    <button class="close" onclick="closeDetail()">✕</button>
    <h3>${st.title || st.project_id}</h3>
    <div class="sub">${st.pipeline?.pipeline_type || ""}${st.live ? " · " + L.liveNow : ""} · ${timeAgo(st.last_activity)}</div>
    <div class="stages">${stages}</div>
    ${renders ? `<div class="h4">${L.finalVideos}</div><div class="renders">${renders}</div>` : ""}
    ${snaps ? `<div class="h4">${L.frames}</div><div class="snaps">${snaps}</div>` : ""}`;
}
$("#overlay").addEventListener("click", e => { if (e.target === $("#overlay")) closeDetail(); });

/* ── heartbeat ─────────────────────────────────────────────────────────── */
async function tick(){
  const L = t();
  try {
    const h = await fetch("/api/health");
    $("#health").textContent = h.ok ? L.live : L.offline;
    $("#health").classList.toggle("off", !h.ok);
  } catch {
    $("#health").textContent = L.offline;
    $("#health").classList.add("off");
  }
  await renderProjects();
  await renderRequests();
  if (openProject) await renderDetail();
}
document.querySelectorAll("#langs button").forEach(b => b.addEventListener("click", () => {
  LANG = b.dataset.lang;
  localStorage.setItem("studio-lang", LANG);
  applyLang(); tick();
}));
applyLang();
tick();
setInterval(tick, 5000);
</script>
